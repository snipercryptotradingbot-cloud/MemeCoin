name: Deploy Solana Program

on:
  push:
    branches: [dev, qa, main]
    paths:
      - 'programs/bonding_curve/**'
      - 'Anchor.toml'
      - '.github/workflows/deploy-solana.yml'
  workflow_dispatch:

env:
  SOLANA_VERSION: '4.2.2'
  ANCHOR_CLI_VERSION: '0.30.1'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.79.0

      - name: Install deployer keypair
        env:
          DEPLOYER_KEYPAIR: ${{ secrets.SOLANA_DEPLOYER_KEYPAIR }}
        run: |
          mkdir -p "$HOME/.config/solana"
          printf '%s' "$DEPLOYER_KEYPAIR" | base64 -d > "$HOME/.config/solana/id.json"

      - name: Install program keypair
        env:
          PROGRAM_KEYPAIR: ${{ secrets.SOLANA_PROGRAM_KEYPAIR }}
        run: |
          mkdir -p target/deploy
          printf '%s' "$PROGRAM_KEYPAIR" | base64 -d > target/deploy/bonding_curve-keypair.json

      - name: Install Solana CLI
        run: |
          curl -SfL "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          echo "$PWD/solana-release/bin" >> "$GITHUB_PATH"
          printf '#!/usr/bin/env bash\nprintf "solana-install %s\n" "${SOLANA_VERSION}"\n' > /usr/local/bin/solana-install
          chmod +x /usr/local/bin/solana-install

      - name: Cache Anchor CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: anchor-${{ env.ANCHOR_CLI_VERSION }}

      - name: Install Anchor CLI
        run: |
          if ! command -v anchor >/dev/null 2>&1; then
            cargo install --locked anchor-cli --version "$ANCHOR_CLI_VERSION"
          else
            anchor --version
          fi

      - name: Switch to rust 1.98 for program build
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0

      - name: Airdrop deployer (devnet only)
        if: github.ref_name != 'main'
        run: |
          for i in 1 2 3; do
            solana --url https://api.devnet.solana.com airdrop 2 && break
            sleep 5
          done || true

      - name: Build program
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            anchor build -- --features mainnet
          else
            anchor build
          fi
          cp programs/bonding_curve/target/deploy/bonding_curve.so target/deploy/bonding_curve.so

      - name: Deploy to devnet
        if: github.ref_name != 'main'
        run: anchor deploy --provider.cluster devnet

      - name: Deploy to mainnet
        if: github.ref_name == 'main'
        run: anchor deploy --provider.cluster mainnet
